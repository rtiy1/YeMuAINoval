name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: yemu-novel-windows-x64
            bundles: nsis
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: yemu-novel-macos-x64
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: yemu-novel-macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build web frontend and runtime
        run: |
          bun run build
          bun scripts/prepare-runtime.mjs

      - name: Verify runtime size
        shell: bash
        run: |
          size=$(du -sm .server-runtime | cut -f1)
          echo "Runtime bundle: ${size}MB"
          if [ "$size" -gt 80 ]; then
            echo "::error::运行时超过 80MB（$size MB），检查是否有意外的依赖被打包"
            exit 1
          fi

      - name: Fetch Bun sidecar runtime
        run: bun scripts/fetch-bun-runtime.mjs ${{ matrix.target }}

      # beforeBuildCommand 会再跑一次 build + prepare-runtime；这一步主要是
      # 让 Rust 侧拿到正确的资源与 sidecar。
      - name: Build desktop app
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
