name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: yemu-novel-windows-x64
            bundles: nsis
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: yemu-novel-macos-x64
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: yemu-novel-macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        run: bun run build

      - name: Fetch Bun sidecar runtime
        run: bun scripts/fetch-bun-runtime.mjs ${{ matrix.target }}

      - name: Build desktop app
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
