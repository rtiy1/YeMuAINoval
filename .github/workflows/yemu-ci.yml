name: YeMu Agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yemu-ci.yml"
      - "src/**"
      - "server/**"
      - "skills/**"
      - "public/**"
      - "index.html"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy.sh"
      - "vite.config.js"
      - "tsconfig.app.json"
      - "packages/agent/**"
      - "packages/ai/**"
      - "packages/catalog/**"
      - "packages/coding-agent/**"
      - "packages/utils/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/yemu-ci.yml"
      - "src/**"
      - "server/**"
      - "skills/**"
      - "public/**"
      - "index.html"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy.sh"
      - "vite.config.js"
      - "tsconfig.app.json"
      - "packages/agent/**"
      - "packages/ai/**"
      - "packages/catalog/**"
      - "packages/coding-agent/**"
      - "packages/utils/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: yemu-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Agent, shell, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Type-check YeMu agent
        run: bun run check

      - name: Validate server deployment script
        run: |
          bash -n deploy.sh
          cp .env.example .env
          AUTH_SECRET=ci-only-auth-secret-with-at-least-32-characters \
          POSTGRES_PASSWORD=ci-only-postgres-password \
          YEMU_ENV_FILE=.env \
          docker compose config --quiet
          rm .env

      - name: Run YeMu tests
        run: bun run test

      - name: Build production frontend
        run: bun run build

      - name: Check patch whitespace
        run: git diff --check
