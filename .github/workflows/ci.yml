name: CI

on:
  push:
    branches: [main, feat/unified-ai-assistant]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.lock

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r ai-service/requirements.lock

      - name: Run test suite
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

  compose:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install test runner dependencies
        run: npm ci

      - name: Run isolated Compose integration
        run: npm run test:postgres
