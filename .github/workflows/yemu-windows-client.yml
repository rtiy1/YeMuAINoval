name: YeMu Windows client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/yemu-windows-client.yml"
      - "packages/yemu-novel-agent/src/**"
      - "packages/yemu-novel-agent/src-tauri/**"
      - "packages/yemu-novel-agent/package.json"
      - "packages/yemu-novel-agent/vite.config.js"
      - "bun.lock"
  pull_request:
    paths:
      - ".github/workflows/yemu-windows-client.yml"
      - "packages/yemu-novel-agent/src/**"
      - "packages/yemu-novel-agent/src-tauri/**"
      - "packages/yemu-novel-agent/package.json"
      - "packages/yemu-novel-agent/vite.config.js"
      - "bun.lock"

permissions:
  contents: read

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun --cwd=packages/yemu-novel-agent run test:unit

      - name: Build Windows installer
        run: bun --cwd=packages/yemu-novel-agent run desktop:build -- --bundles nsis

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: yemu-story-windows-x64-unsigned
          path: packages/yemu-novel-agent/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
