services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-story_studio}
      POSTGRES_USER: ${POSTGRES_USER:-story}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-story} -d ${POSTGRES_DB:-story_studio}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      STORY_SKILLS_ROOT: /app/skills
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SOURCE_REPOSITORY_URL: ${SOURCE_REPOSITORY_URL:-https://github.com/rtiy1/YeMuAINoval}
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-story}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-story_studio}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_TASK_QUEUE_ENABLED: "true"
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-0}
      AI_CONCURRENT_REQUEST_LIMIT: ${AI_CONCURRENT_REQUEST_LIMIT:-3}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-30}
      ALLOW_SHARED_MODEL_KEY: ${ALLOW_SHARED_MODEL_KEY:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-owner-only}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      REFRESH_SESSION_DAYS: ${REFRESH_SESSION_DAYS:-90}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      EMAIL_VERIFICATION_CODE_TTL_MINUTES: ${EMAIL_VERIFICATION_CODE_TTL_MINUTES:-10}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AI_SERVICE_URL: http://ai:8890
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      SKILL_REVIEW_MODE: ${SKILL_REVIEW_MODE:-required}
      SKILL_REVIEW_API_URL: ${SKILL_REVIEW_API_URL:-}
      SKILL_REVIEW_API_KEY: ${SKILL_REVIEW_API_KEY:-}
      SKILL_REVIEW_MODEL: ${SKILL_REVIEW_MODEL:-}
      SKILL_REVIEW_API_STYLE: ${SKILL_REVIEW_API_STYLE:-responses}
      SKILL_REVIEW_TIMEOUT_MS: ${SKILL_REVIEW_TIMEOUT_MS:-45000}
      STORY_SKILL_MARKET_DIR: /app/server/data/skill-market
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8787}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CODESPACES: ${CODESPACES:-false}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8787}:8787"
    volumes:
      - skill_market_data:/app/server/data/skill-market
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SOURCE_REPOSITORY_URL: ${SOURCE_REPOSITORY_URL:-https://github.com/rtiy1/YeMuAINoval}
    command: ["node", "server/ai-worker.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-story}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-story_studio}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_TASK_QUEUE_ENABLED: "true"
      AI_TASK_CLAIM_IDLE_MS: ${AI_TASK_CLAIM_IDLE_MS:-180000}
      AI_TASK_CLAIM_INTERVAL_MS: ${AI_TASK_CLAIM_INTERVAL_MS:-30000}
      ALLOW_SHARED_MODEL_KEY: ${ALLOW_SHARED_MODEL_KEY:-false}
      AI_SERVICE_URL: http://ai:8890
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/story-ai-worker-ready && test -n \"$(find /tmp/story-ai-worker-ready -mmin -1 -print -quit)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  skill_market_data:
