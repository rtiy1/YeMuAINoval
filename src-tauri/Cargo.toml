[package]
name = "yemu-story"
version = "0.1.0"
description = "夜幕 AI 小说 Windows 客户端"
authors = ["YeMuAINoval contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/rtiy1/YeMuAINoval"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yemu_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["cookies"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
